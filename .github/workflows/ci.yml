name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch / pull request; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Privacy, models, docs and packaging scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libxcb1-dev libxcb-randr0-dev pkg-config \
            desktop-file-utils shellcheck

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache the build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Privacy check (no network code, no frames written)
        run: cargo xtask check-privacy

      - name: Verify the bundled face models
        run: cargo xtask fetch-models --check

      - name: Check that docs/configuration.md is up to date
        run: cargo xtask gen-config-docs --check

      - name: Check packaging scripts
        run: |
          shellcheck packaging/linux/build_appimage.sh packaging/linux/AppRun packaging/macos/make_app.sh packaging/macos/make_dmg.sh packaging/release_notes.sh
          desktop-file-validate packaging/linux/eye-tracker.desktop

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libxcb1-dev libxcb-randr0-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache the build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      # Clippy runs on every OS: the platform modules are compiled only for their own.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the tests
        run: cargo test
