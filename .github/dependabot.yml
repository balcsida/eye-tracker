# Keep GitHub Actions and Cargo dependencies (Cargo.lock) up to date.
# Workflow actions are pinned to commit SHAs with a "# vX.Y.Z" comment; Dependabot
# updates both together.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - rust
    groups:
      # Patch releases move together; minor and major ones come one at a time because
      # tract, egui/eframe and nokhwa can change inference results, rendering or camera
      # support (the face models run on tract).
      patches:
        update-types:
          - patch
