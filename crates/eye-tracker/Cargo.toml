[package]
name = "eye-tracker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Look at a monitor and your cursor and keyboard focus follow."

[lib]
name = "eye_tracker"

[[bin]]
name = "eye-tracker"
path = "src/bin/eye-tracker.rs"

[[bin]]
name = "eye-tracker-gui"
path = "src/bin/eye-tracker-gui.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
