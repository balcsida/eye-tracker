[workspace]
resolver = "2"
members = ["crates/eye-tracker", "crates/xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bugraskl/eye-tracker"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.dependencies]
# CLI, config, logging, errors
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a reloaded model must equal the saved one; preserve_order: the files keep the
# key order the Python app wrote.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
directories = "6.0.0"
log = "0.4.34"
flexi_logger = "0.31.10"
thiserror = "2.0.21"
anyhow = "1.0.104"
# Threads
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
# Numerics, images, inference
nalgebra = "0.35.0"
ndarray = "0.17.2"
image = "0.25.10"
fast_image_resize = "6.1.0"
imageproc = "0.27.0"
tract-tflite = "0.23.8"
tract-onnx = "0.23.8"
# No default features: `decoding` pulls in mozjpeg (C), which blocks cross-target checks; MJPEG
# frames are decoded with the pure-Rust `image` crate instead.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
# UI
egui = "0.36.2"
eframe = "0.36.2"
tray-icon = "0.26.1"
ksni = "0.3.6"
notify-rust = "4.18.2"
# rfd only on Windows/macOS (its Linux backend needs GTK), and only for the fatal error box;
# file picking is egui-file-dialog everywhere.
rfd = "0.17.2"
egui-file-dialog = "0.15.0"
global-hotkey = "0.8.0"
# IPC, processes, hashing
interprocess = "2.4.5"
sysinfo = "0.39.6"
sha1 = "0.10"
sha2 = "0.11.1"
hex = "0.4.3"
# xtask network (dev tooling only)
ureq = "3.4.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
ico = "0.6.0"
regex = "1.13.1"
icns = "0.5.0"
# Platform
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_Accessibility",
  "Win32_Networking_WinHttp",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
] }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-application-services = "0.3.2"
core-foundation = "0.10.1"
x11rb = { version = "0.14.0", features = ["xtest", "xkb", "randr"] }
zbus = "5.19.0"
libc = "0.2"
# Dev
approx = "0.5"
tempfile = "3.27.0"
